<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Video Earn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef1f7; --card:#fff; --ink:#101a30; --muted:#6a7690; --line:#e1e6ef; --accent:#1f5eff; --soft:#e8efff; --danger:#d6455d; --ok:#1f9d6b; --gold:#c98a00; --shadow:0 1px 2px rgba(16,26,48,.04), 0 8px 24px -12px rgba(16,26,48,.12); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b101d; --card:#141b2d; --ink:#e8ecf6; --muted:#8a96b2; --line:#232d47; --accent:#5b8cff; --soft:#1a2748; --danger:#ff6b84; --ok:#3ecf94; --gold:#f2b84b; --shadow:none; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:500 16px/1.5 Manrope, system-ui, sans-serif; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width:560px; margin:0 auto; padding:24px 16px 56px; }
  h1 { font-size:1.6rem; font-weight:800; letter-spacing:-.02em; margin:0; }
  h2 { font-size:1.1rem; margin:22px 0 10px; }
  .sub { color:var(--muted); font-size:.9rem; margin:2px 0 0; word-break:break-all; }
  .hidden { display:none !important; }
  button { font:inherit; cursor:pointer; border:0; }
  input[type=text], input[type=email], input[type=password], input[type=url], input[type=number] { width:100%; font:inherit; color:var(--ink); background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--soft); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .primary { background:var(--accent); color:#fff; font-weight:700; border-radius:12px; padding:12px 18px; }
  .primary:disabled { opacity:.45; cursor:not-allowed; }
  .ghost { background:none; color:var(--muted); font-weight:600; font-size:.9rem; padding:8px 10px; border-radius:10px; }
  .ghost:hover { background:var(--soft); color:var(--accent); }
  .card { background:var(--card); border-radius:18px; box-shadow:var(--shadow); border:1px solid var(--line); padding:16px; margin-bottom:12px; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:18px; }
  header .right { display:flex; gap:2px; flex-shrink:0; }
  #boot { text-align:center; color:var(--muted); margin-top:30vh; }
  #auth { padding:26px 22px; margin-top:8vh; }
  #auth .sub { margin-bottom:20px; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:14px; }
  .tabs button { background:none; color:var(--muted); font-weight:700; padding:10px; border-radius:9px; }
  .tabs button.on { background:var(--soft); color:var(--accent); }
  label { display:block; font-size:.85rem; font-weight:700; margin-bottom:12px; }
  label input { margin-top:6px; font-weight:500; }
  #auth .primary { width:100%; }
  .wallet { display:flex; align-items:baseline; justify-content:space-between; }
  .wallet b { font-size:2.4rem; font-weight:800; letter-spacing:-.03em; color:var(--gold); }
  .row { display:flex; align-items:center; gap:12px; }
  .grow { flex:1; min-width:0; }
  .grow b { display:block; word-break:break-word; }
  .chips { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .chip { font-size:.75rem; font-weight:700; padding:2px 9px; border-radius:99px; background:var(--soft); color:var(--accent); }
  .chip.gold { background:rgba(201,138,0,.14); color:var(--gold); }
  .done { color:var(--ok); font-weight:700; font-size:.85rem; }
  .empty { text-align:center; color:var(--muted); border-style:dashed; box-shadow:none; }
  .amt { font-weight:800; color:var(--ok); }
  video { width:100%; border-radius:12px; background:#000; aspect-ratio:16/9; display:block; }
  .bar { height:8px; background:var(--soft); border-radius:99px; margin:14px 0 6px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .4s; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .u > button { width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:none; color:var(--ink); padding:0; }
  .av { width:38px; height:38px; border-radius:50%; background:var(--soft); color:var(--accent); display:grid; place-items:center; font-weight:800; flex-shrink:0; }
  .u ul { list-style:none; margin:12px 0 0; padding:10px 0 0; border-top:1px solid var(--line); }
  .u li { padding:3px 0; font-size:.9rem; }
  .act { background:none; color:var(--danger); font-weight:600; font-size:.85rem; padding:6px 8px; }
  .note p { word-break:normal; margin:6px 0 0; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:22px; }
  footer.err { color:var(--danger); }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translate(-50%,20px); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:12px; font-weight:600; font-size:.9rem; opacity:0; pointer-events:none; transition:.25s; max-width:90%; text-align:center; z-index:9; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<div id="toast" role="status"></div>
<main>
  <p id="boot">Load ho raha hai...</p>

  <section id="auth" class="card hidden">
    <h1>Video Earn</h1>
    <p class="sub">Video dekho, coins kamao. (Abhi nakli coins, seekhne ke liye)</p>
    <div class="tabs"><button id="tabLogin" class="on" type="button">Login</button><button id="tabSignup" type="button">Naya account</button></div>
    <form id="authForm">
      <label>Email<input type="email" id="email" autocomplete="email" required></label>
      <label>Password<input type="password" id="pass" autocomplete="current-password" minlength="6" required></label>
      <button class="primary" id="authBtn">Login karo</button>
    </form>
  </section>

  <section id="home" class="hidden">
    <header>
      <div><h1>Video Earn</h1><p class="sub" id="who"></p></div>
      <div class="right"><button class="ghost hidden" id="adminBtn">Admin</button><button class="ghost" id="out">Logout</button></div>
    </header>
    <div class="card wallet"><span class="sub">Tumhare coins</span><b id="coins">0</b></div>
    <div class="tabs" style="grid-template-columns:1fr 1fr 1fr"><button id="tV" class="on">Videos</button><button id="tW">Wallet</button><button id="tS">Kharido</button></div>
    <div id="vList"></div>
    <div id="wList" class="hidden"></div>
    <div id="sList" class="hidden"></div>
  </section>

  <section id="player" class="hidden">
    <header>
      <div><h1 id="pTitle"></h1><p class="sub" id="pSub"></p></div>
      <div class="right"><button class="ghost" id="pBack">Wapas</button></div>
    </header>
    <div class="card">
      <video id="vid" playsinline controlsList="nodownload"></video>
      <div class="bar"><i id="pFill"></i></div>
      <p class="sub" id="pTxt"></p>
      <div class="btns"><button class="primary" id="pPlay">Chalao</button><button class="primary" id="claim" disabled>Coins lo</button></div>
    </div>
  </section>

  <section id="admin" class="hidden">
    <header>
      <div><h1>Admin</h1><p class="sub">Videos jodo aur users dekho</p></div>
      <div class="right"><button class="ghost" id="aBack">Wapas</button></div>
    </header>
    <form id="vForm" class="card">
      <label>Video ka naam<input type="text" id="vt" required></label>
      <label>Video link (seedha .mp4)<input type="url" id="vu" placeholder="https://..." required></label>
      <div class="btns">
        <label>Coins<input type="number" id="vr" min="1" max="1000" value="10" required></label>
        <label>Kitne second dekhna hai<input type="number" id="vs" min="5" max="600" value="15" required></label>
      </div>
      <button class="primary" style="width:100%">Video jodo</button>
    </form>
    <div id="aVids"></div>
    <h2>Users</h2>
    <div id="users"></div>
  </section>

  <footer id="status">Firebase se connect ho raha hai...</footer>
</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, setDoc, getDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjxqern4xx5IfWb-3KnEDJysXI3aKjQJI",
    authDomain: "todo-learning-7eb8e.firebaseapp.com",
    projectId: "todo-learning-7eb8e",
    storageBucket: "todo-learning-7eb8e.firebasestorage.app",
    messagingSenderId: "716563997241",
    appId: "1:716563997241:web:26d9920b377b71e6d863e8"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle("hidden", !on);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const initial = (e) => (e || "?")[0].toUpperCase();
  const when = (ts) => ts ? ts.toDate().toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "abhi";

  let uid = null, isSignup = false, unsubs = [], videos = [], rewards = [], cur = null, watched = 0, maxT = 0, tick = null, tt;

  const msgs = {
    "auth/invalid-credential": "Email ya password galat hai.",
    "auth/email-already-in-use": "Ye email pehle se registered hai. Login karo.",
    "auth/weak-password": "Password kam se kam 6 akshar ka rakho.",
    "auth/invalid-email": "Email sahi format mein likho.",
    "permission-denied": "Ijazat nahi mili (shayad coins pehle mil chuke hain)."
  };
  function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 3500); }
  function showError(err) { console.error(err); toast(msgs[err.code] || ("Dikkat: " + (err.code || err.message))); }
  function view(n) { ["auth", "home", "player", "admin"].forEach((v) => show(v, v === n)); show("boot", false); }

  // ---- Login ----
  function setMode(s) {
    isSignup = s;
    $("tabLogin").classList.toggle("on", !s); $("tabSignup").classList.toggle("on", s);
    $("authBtn").textContent = s ? "Account banao" : "Login karo";
    $("pass").autocomplete = s ? "new-password" : "current-password";
  }
  $("tabLogin").onclick = () => setMode(false);
  $("tabSignup").onclick = () => setMode(true);
  $("authForm").onsubmit = async (e) => {
    e.preventDefault(); $("authBtn").disabled = true;
    try { await (isSignup ? createUserWithEmailAndPassword : signInWithEmailAndPassword)(auth, $("email").value.trim(), $("pass").value); }
    catch (err) { showError(err); }
    $("authBtn").disabled = false;
  };
  $("out").onclick = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    unsubs.forEach((f) => f()); unsubs = []; clearInterval(tick);
    if (!user) { uid = null; view("auth"); return; }
    uid = user.uid;
    $("who").textContent = user.email;
    view("home"); renderShop();
    setDoc(doc(db, "users", uid), { email: user.email, lastLogin: serverTimestamp() }, { merge: true }).catch(showError);
    getDoc(doc(db, "admins", uid)).then((s) => show("adminBtn", s.exists())).catch(() => show("adminBtn", false));

    // Live: saare videos (sab padh sakte hain)
    unsubs.push(onSnapshot(query(collection(db, "videos"), orderBy("createdAt", "desc")), (s) => {
      videos = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderVideos(); renderAdminVideos();
    }, showError));
    // Live: sirf is user ke rewards (ledger). Balance inhi ko jod kar nikalta hai
    unsubs.push(onSnapshot(query(collection(db, "users", uid, "rewards"), orderBy("createdAt", "desc")), (s) => {
      rewards = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      $("coins").textContent = rewards.reduce((a, r) => a + (r.amount || 0), 0);
      $("status").textContent = "● Firebase se connected"; $("status").className = "";
      renderWallet(); renderVideos();
    }, showError));
  });

  // ---- Home ----
  const tabs = { tV: "vList", tW: "wList", tS: "sList" };
  Object.keys(tabs).forEach((t) => ($(t).onclick = () => {
    Object.keys(tabs).forEach((k) => { $(k).classList.toggle("on", k === t); show(tabs[k], k === t); });
  }));

  // ---- Kharido: Razorpay Checkout (TEST MODE, Stage 1) ----
  const RZP_KEY = "rzp_test_U3Cc3c4eNtqji5"; // Key ID public hoti hai. Key Secret yahan kabhi nahi aayegi
  const packs = [{ price: 10, coins: 100 }, { price: 50, coins: 600 }, { price: 100, coins: 1300 }];
  let lastPay = "";
  function renderShop() {
    const box = $("sList"); box.textContent = "";
    const note = el("div", "card note");
    note.append(el("b", "", "Demo (Stage 1)"),
      el("p", "sub", "Ye payment popup seekhne ke liye hai. Abhi coins nahi jud'te, wo Stage 2 mein server se jud'enge."),
      el("p", "sub", "Test UPI: success@razorpay"),
      el("p", "sub", "Test card: 5267 3181 8797 5449, koi bhi aage ki expiry aur koi bhi CVV"));
    box.append(note);
    packs.forEach((p) => {
      const c = el("div", "card row"); const g = el("div", "grow");
      g.append(el("b", "", p.coins + " coins"));
      const b = el("button", "primary", "₹" + p.price + " mein kharido"); b.onclick = () => pay(p);
      c.append(g, b); box.append(c);
    });
    if (lastPay) { const l = el("div", "card note"); l.append(el("b", "", "Aakhri payment safal ✓"), el("p", "sub", "Payment ID: " + lastPay)); box.append(l); }
  }
  function pay(p) {
    if (!window.Razorpay) { toast("Razorpay load nahi hua. Internet check karo."); return; }
    const rz = new window.Razorpay({
      key: RZP_KEY,
      amount: p.price * 100, // paise mein: ₹10 = 1000 paise
      currency: "INR",
      name: "Video Earn",
      description: p.coins + " coins (test)",
      prefill: { email: auth.currentUser ? auth.currentUser.email : "" },
      theme: { color: "#1f5eff" },
      // Payment safal hone par Razorpay ye function chalata hai aur payment ID deta hai
      handler: (res) => { lastPay = res.razorpay_payment_id; toast("Payment safal ✓"); renderShop(); },
      modal: { ondismiss: () => toast("Popup band hua") }
    });
    rz.on("payment.failed", (r) => toast("Payment fail: " + ((r.error && r.error.description) || "")));
    rz.open();
  }

  function renderVideos() {
    const box = $("vList"); box.textContent = "";
    if (!videos.length) { box.append(el("div", "card empty", "Abhi koi video nahi. Admin se video jodne ko kaho.")); return; }
    const got = new Set(rewards.map((r) => r.id));
    videos.forEach((v) => {
      const c = el("div", "card row");
      const g = el("div", "grow"); g.append(el("b", "", v.title));
      const chips = el("div", "chips"); chips.append(el("span", "chip gold", "+" + v.reward + " coins"), el("span", "chip", v.seconds + " second"));
      g.append(chips);
      c.append(g);
      if (got.has(v.id)) c.append(el("span", "done", "✓ Mil gaye"));
      else { const b = el("button", "primary", "Dekho"); b.onclick = () => openPlayer(v); c.append(b); }
      box.append(c);
    });
  }
  function renderWallet() {
    const box = $("wList"); box.textContent = "";
    box.append(el("p", "sub", "Ye nakli coins hain, seekhne ke liye. Har coin ka hisaab yahan likha rehta hai (ledger)."));
    if (!rewards.length) { box.append(el("div", "card empty", "Abhi koi kamai nahi.")); return; }
    rewards.forEach((r) => {
      const c = el("div", "card row"); const g = el("div", "grow"); g.append(el("b", "", r.title || "Video"), el("span", "sub", when(r.createdAt)));
      c.append(g, el("span", "amt", "+" + r.amount)); box.append(c);
    });
  }

  // ---- Player ----
  const vid = $("vid");
  function upd() {
    $("pFill").style.width = Math.min(100, Math.round(watched / cur.seconds * 100)) + "%";
    const ok = watched >= cur.seconds;
    $("pTxt").textContent = ok ? "Poora dekh liya! Ab coins lo." : watched + " / " + cur.seconds + " second dekhe";
    $("claim").disabled = !ok;
  }
  function openPlayer(v) {
    cur = v; watched = 0; maxT = 0;
    $("pTitle").textContent = v.title; $("pSub").textContent = "Poora dekho, phir +" + v.reward + " coins milenge";
    vid.src = v.url; $("pPlay").textContent = "Chalao"; upd(); view("player");
    clearInterval(tick);
    // Har second check: video chal raha hai aur screen par hai tabhi second gino
    tick = setInterval(() => { if (!vid.paused && !vid.ended && !document.hidden) { watched++; upd(); } }, 1000);
  }
  function backHome() { clearInterval(tick); vid.pause(); vid.removeAttribute("src"); vid.load(); view("home"); }
  $("pBack").onclick = backHome;
  $("pPlay").onclick = () => (vid.paused ? vid.play() : vid.pause());
  vid.onplay = () => ($("pPlay").textContent = "Roko");
  vid.onpause = () => ($("pPlay").textContent = "Chalao");
  vid.onerror = () => { if (vid.getAttribute("src")) toast("Video load nahi hua. Link check karo."); };
  vid.ontimeupdate = () => { if (vid.currentTime > maxT) maxT = vid.currentTime; };
  vid.onseeking = () => { if (vid.currentTime > maxT + 1) vid.currentTime = maxT; }; // aage skip nahi
  document.addEventListener("visibilitychange", () => { if (document.hidden) vid.pause(); });

  $("claim").onclick = async () => {
    $("claim").disabled = true;
    try {
      // Document ki ID = video ki ID, isliye ek video ka reward ek hi baar ban sakta hai
      await setDoc(doc(db, "users", uid, "rewards", cur.id), { amount: cur.reward, title: cur.title, createdAt: serverTimestamp() });
      toast("+" + cur.reward + " coins mil gaye 🎉"); backHome();
    } catch (err) { showError(err); }
  };

  // ---- Admin ----
  $("adminBtn").onclick = () => { view("admin"); loadUsers(); };
  $("aBack").onclick = () => view("home");
  $("vForm").onsubmit = async (e) => {
    e.preventDefault();
    try {
      await addDoc(collection(db, "videos"), { title: $("vt").value.trim(), url: $("vu").value.trim(), reward: Number($("vr").value), seconds: Number($("vs").value), createdAt: serverTimestamp() });
      $("vForm").reset(); $("vr").value = 10; $("vs").value = 15; toast("Video jud gaya");
    } catch (err) { showError(err); }
  };
  function renderAdminVideos() {
    const box = $("aVids"); box.textContent = "";
    videos.forEach((v) => {
      const c = el("div", "card row"); const g = el("div", "grow"); g.append(el("b", "", v.title), el("span", "sub", v.reward + " coins · " + v.seconds + " second"));
      const d = el("button", "act", "Hatao"); d.onclick = () => deleteDoc(doc(db, "videos", v.id)).catch(showError);
      c.append(g, d); box.append(c);
    });
  }
  async function loadUsers() {
    const box = $("users"); box.textContent = "Load ho raha hai...";
    try {
      const snap = await getDocs(collection(db, "users")); box.textContent = "";
      snap.forEach((u) => {
        const data = u.data(); const card = el("div", "card u"); const head = el("button");
        const g = el("div", "grow"); g.append(el("b", "", data.email || u.id), el("span", "sub", "Last login: " + when(data.lastLogin)));
        head.append(el("span", "av", initial(data.email)), g);
        const ul = el("ul", "hidden");
        head.onclick = async () => {
          if (!ul.classList.contains("hidden")) { ul.classList.add("hidden"); return; }
          ul.textContent = "";
          try {
            const rs = await getDocs(collection(db, "users", u.id, "rewards")); let total = 0;
            rs.forEach((r) => { total += r.data().amount || 0; ul.append(el("li", "", "• " + (r.data().title || "Video") + "  +" + r.data().amount)); });
            ul.prepend(el("li", "amt", "Total: " + total + " coins"));
            ul.classList.remove("hidden");
          } catch (err) { showError(err); }
        };
        card.append(head, ul); box.append(card);
      });
    } catch (err) { showError(err); }
  }
</script>
</body>
</html>
